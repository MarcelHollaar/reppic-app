services:
  app:
    build:
      context: app
      args:
        - DATABASE_URL=${DATABASE_URL}
        - JWT_SECRET=${JWT_SECRET}
        - APP_NAME=${APP_NAME}
        - FROM_MAIL=${FROM_MAIL}
        - SMTP_HOST=${SMTP_HOST}
        - SMTP_PORT=${SMTP_PORT}
        - SMTP_USER=${SMTP_USER}
        - SMTP_PASS=${SMTP_PASS}
        - FFMPEG_PATH=${FFMPEG_PATH}
        - FFPROBE_PATH=${FFPROBE_PATH}
        - APP_URL=${APP_URL}
        - LITELLM_BASE_URL=${LITELLM_BASE_URL}
        - LITELLM_API_KEY=${LITELLM_API_KEY}
        - LITELLM_MODEL=${LITELLM_MODEL}
        - LITELLM_TAG=${LITELLM_TAG}
        - FTP_HOST=${FTP_HOST}
        - FTP_USER=${FTP_USER}
        - FTP_PASSWORD=${FTP_PASSWORD}
        - FTP_SECURE=${FTP_SECURE}
        - FTP_PUBLIC_URL=${FTP_PUBLIC_URL}
        - FTP_WEB_ROOT=${FTP_WEB_ROOT}
        - NEXT_PUBLIC_FTP_PUBLIC_URL=${NEXT_PUBLIC_FTP_PUBLIC_URL}
        - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME}
        - NEXT_PUBLIC_NODE_ENV=${NEXT_PUBLIC_NODE_ENV}
        - WEBHOOK_SECRET_KEY=${WEBHOOK_SECRET_KEY}
        - WEBHOOK_SIGNING_SECRET=${WEBHOOK_SIGNING_SECRET}
        - SURECART_API_SECRET_KEY=${SURECART_API_SECRET_KEY}
        - LIVEAVATAR_API_KEY=${LIVEAVATAR_API_KEY}
        - LIVEAVATAR_AVATAR_ID=${LIVEAVATAR_AVATAR_ID}
        - LIVEAVATAR_VOICE_ID=${LIVEAVATAR_VOICE_ID}
        - OPENAI_API_KEY=${OPENAI_API_KEY}
        - TRANSCRIPTION_PROVIDER=${TRANSCRIPTION_PROVIDER}
        - ASSEMBLYAI_API_KEY=${ASSEMBLYAI_API_KEY}
        - APP_BASE_URL=${APP_BASE_URL}
        - NEXT_PUBLIC_AXIOM_TOKEN=${NEXT_PUBLIC_AXIOM_TOKEN}
        - NEXT_PUBLIC_AXIOM_DATASET=${NEXT_PUBLIC_AXIOM_DATASET}
        - NEXT_PUBLIC_LMS_URL=${NEXT_PUBLIC_LMS_URL}
        - ENVIRONMENT=${ENVIRONMENT}
        - RECORDINGS_FOLDER=${RECORDINGS_FOLDER}
        - RECALL_API_KEY=${RECALL_API_KEY}
        - RECALL_WEBHOOK_SECRET=${RECALL_WEBHOOK_SECRET}
        - EXCEL_DATA_FTP_FOLDER=${EXCEL_DATA_FTP_FOLDER}
        - LMS_API_URL=${LMS_API_URL}
        - LMS_WEBHOOK_SECRET=${LMS_WEBHOOK_SECRET}
        - LMS_SYNC_FAILURE_EMAILS=${LMS_SYNC_FAILURE_EMAILS}
        - NEXT_PUBLIC_DASHBOARD_API_URL=${NEXT_PUBLIC_DASHBOARD_API_URL}
        - DASHBOARD_API_URL=${DASHBOARD_API_URL:-http://dashboard-backend:5001}
        - CRON_SECRET=${CRON_SECRET}
    depends_on:
      db:
        condition: "service_healthy"
      dashboard-backend:
        condition: "service_started"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - APP_NAME=${APP_NAME}
      - FROM_MAIL=${FROM_MAIL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - FFMPEG_PATH=${FFMPEG_PATH}
      - FFPROBE_PATH=${FFPROBE_PATH}
      - APP_URL=${APP_URL}
      - LITELLM_BASE_URL=${LITELLM_BASE_URL}
      - LITELLM_API_KEY=${LITELLM_API_KEY}
      - LITELLM_MODEL=${LITELLM_MODEL}
      - LITELLM_TAG=${LITELLM_TAG}
      - FTP_HOST=${FTP_HOST}
      - FTP_USER=${FTP_USER}
      - FTP_PASSWORD=${FTP_PASSWORD}
      - FTP_SECURE=${FTP_SECURE}
      - FTP_PUBLIC_URL=${FTP_PUBLIC_URL}
      - FTP_WEB_ROOT=${FTP_WEB_ROOT}
      - NEXT_PUBLIC_FTP_PUBLIC_URL=${NEXT_PUBLIC_FTP_PUBLIC_URL}
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME}
      - NEXT_PUBLIC_NODE_ENV=${NEXT_PUBLIC_NODE_ENV}
      - LIVEAVATAR_API_KEY=${LIVEAVATAR_API_KEY}
      - LIVEAVATAR_AVATAR_ID=${LIVEAVATAR_AVATAR_ID}
      - LIVEAVATAR_VOICE_ID=${LIVEAVATAR_VOICE_ID}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TRANSCRIPTION_PROVIDER=${TRANSCRIPTION_PROVIDER}
      - ASSEMBLYAI_API_KEY=${ASSEMBLYAI_API_KEY}
      - APP_BASE_URL=${APP_BASE_URL}
      - NEXT_PUBLIC_AXIOM_TOKEN=${NEXT_PUBLIC_AXIOM_TOKEN}
      - NEXT_PUBLIC_AXIOM_DATASET=${NEXT_PUBLIC_AXIOM_DATASET}
      - NEXT_PUBLIC_LMS_URL=${NEXT_PUBLIC_LMS_URL}
      - ENVIRONMENT=${ENVIRONMENT}
      - RECORDINGS_FOLDER=${RECORDINGS_FOLDER}
      - RECALL_API_KEY=${RECALL_API_KEY}
      - RECALL_WEBHOOK_SECRET=${RECALL_WEBHOOK_SECRET}
      - EXCEL_DATA_FTP_FOLDER=${EXCEL_DATA_FTP_FOLDER}
      - LMS_API_URL=${LMS_API_URL}
      - LMS_WEBHOOK_SECRET=${LMS_WEBHOOK_SECRET}
      - LMS_SYNC_FAILURE_EMAILS=${LMS_SYNC_FAILURE_EMAILS}
      - NEXT_PUBLIC_DASHBOARD_API_URL=${NEXT_PUBLIC_DASHBOARD_API_URL}
      - DASHBOARD_API_URL=${DASHBOARD_API_URL:-http://dashboard-backend:5001}
      - CRON_SECRET=${CRON_SECRET}
    restart: always
    pull_policy: build
    networks:
      - internal-network
      - nginx-proxy-manager_default

  dashboard-backend:
    build:
      context: dashboard-backend
    depends_on:
      db:
        condition: "service_healthy"
    environment:
      - DATABASE_URL=postgresql://postgres:secret@db:5432/sales_dashboard
      - JWT_SECRET=${JWT_SECRET}
      - Reppic_dashboard=${OPENAI_API_KEY}
      - REPPIC_ORIGIN=${APP_BASE_URL:-http://localhost:3000}
      - PORT=5001
      - SESSION_SECRET=${DASHBOARD_SESSION_SECRET:-dashboard-secret}
      - LITELLM_BASE_URL=${LITELLM_BASE_URL}
      - LITELLM_API_KEY=${LITELLM_API_KEY}
      - DASHBOARD_LLM_MODEL=${DASHBOARD_LLM_MODEL:-twinai/large}
      - LITELLM_TAG=${LITELLM_TAG:-baseline}
    ports:
      - "5001:5001"
    restart: always
    pull_policy: build
    networks:
      - internal-network
      - nginx-proxy-manager_default

  cron-cleanup:
    image: alpine:3.21
    restart: unless-stopped
    environment:
      - CRON_SECRET=${CRON_SECRET}
      - APP_BASE_URL=${APP_BASE_URL}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        apk add --no-cache curl > /dev/null
        echo "0 3 * * 0 curl -sf -H \"Authorization: Bearer $$CRON_SECRET\" \"$$APP_BASE_URL/api/cron/cleanup-recordings\" >> /var/log/cron.log 2>&1" > /etc/crontabs/root
        crond -f -l 2
    networks:
      - nginx-proxy-manager_default

  db:
    image: postgres:17.5-bookworm
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DATABASE: sales_studio
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./dashboard-backend/docker/init-sales-dashboard.sql:/docker-entrypoint-initdb.d/02-create-sales-dashboard.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sales_studio"]
      interval: 10s
      timeout: 30s
      retries: 10
    networks:
      - internal-network

volumes:
  db_data:

networks:
  internal-network:
    internal: true
  nginx-proxy-manager_default:
    external: true
