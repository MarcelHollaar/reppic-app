<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-user-select: none;
        cursor: default;
        overflow: hidden;
      }
      #card {
        margin: 8px;
        background: #18181b;
        color: #fff;
        border-radius: 14px;
        padding: 15px 16px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .title {
        font-size: 14px;
        font-weight: 700;
        margin-bottom: 4px;
      }
      .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ef4444;
        margin-right: 7px;
        vertical-align: middle;
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }
      .sub {
        font-size: 12px;
        color: #a1a1aa;
        margin: 0 0 13px;
        line-height: 1.45;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      button {
        flex: 1;
        border: 0;
        border-radius: 9px;
        padding: 9px 12px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .rec {
        background: #ef4444;
        color: #fff;
      }
      .no {
        background: #3f3f46;
        color: #e4e4e7;
      }
    </style>
  </head>
  <body>
    <div id="card">
      <div class="title"><span class="dot"></span>Gesprek gedetecteerd</div>
      <div class="sub" id="sub">Opnemen en na afloop laten analyseren door Reppic?</div>
      <div class="row">
        <button class="rec" id="rec">Opnemen</button>
        <button class="no" id="no">Niet nu</button>
      </div>
    </div>
    <script>
      const sub = document.getElementById("sub");
      if (window.chip && window.chip.onData) {
        window.chip.onData((d) => {
          if (d && d.account) {
            sub.textContent =
              "Opnemen en analyseren door Reppic? (account: " + d.account + ")";
          }
        });
      }
      document.getElementById("rec").onclick = () =>
        window.chip && window.chip.record();
      document.getElementById("no").onclick = () =>
        window.chip && window.chip.dismiss();
    </script>
  </body>
</html>
